<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA TIC TAC TOE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <button class="icon-btn" onclick="window.location.href='setting.html'">⚙️</button>
            <h1 class="game-title">Tirath <span class="accent">TIC TAC TOE</span></h1>
            <button class="icon-btn" onclick="window.location.href='sidebar.html'">🏠</button>
        </header>

        <div class="turn-indicator" id="turnIndicator">
            PLAYER <span id="currentPlayerSymbol" class="o-symbol">O</span>'S TURN
        </div>

        <div class="temple-board">
            <div class="grid" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <div class="timer-container">
            <div class="timer-ring">
                <div class="timer-bar" id="timerBar"></div>
                <span id="timerText">15</span>
            </div>
        </div>

        <button id="resetBtn" class="reset-btn">RESTART RITUAL</button>

        <footer class="scoreboard">
            <div class="score-card">
                <span class="label">PLAYER O</span>
                <span class="value" id="scoreO">0</span>
            </div>
            <div class="score-card draw">
                <span class="label">DRAWS</span>
                <span class="value" id="scoreDraw">0</span>
            </div>
            <div class="score-card">
                <span class="label">PLAYER X</span>
                <span class="value" id="scoreX">0</span>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
